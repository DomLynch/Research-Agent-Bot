# Senolytics topic pack — Proof 005
#
# Senolytics are drugs that selectively eliminate senescent cells,
# proposed as anti-aging therapeutics. The flagship clinical
# combination is dasatinib + quercetin (D+Q); fisetin and navitoclax
# are also being studied. Direct geroscience target — most relevant
# for aging-research framing.

topic   = "senolytics"
class_  = "senolytic"

aliases = [
  "senolytic",
  "senolytics",
  "senotherapeutic",
  # Specific drugs (dasatinib + quercetin combo + others)
  "dasatinib",
  "quercetin",
  "fisetin",
  "navitoclax",
  "ABT-263",
  "ABT-199",  # venetoclax, also senolytic in some contexts
  "D+Q",       # dasatinib + quercetin combo notation
  "DQ",
]

expected_evidence_slots = [
  "human_rcts",
  "human_observational",
  "human_mechanism",
  "preclinical_lifespan",
  "safety_tolerability",
  "dosing_regimen",
  "ongoing_trials",
  "senescence_biomarkers",   # senolytic-specific (p16, p21, SASP)
  "tissue_specificity",       # senolytics differ by tissue (skin, lung, bone)
]

special_rules = [
  "human senolytic data is sparse — most evidence is preclinical mouse models",
  "D+Q has small Phase I/II trials (Hickson 2019 IPF, Justice 2019 diabetic kidney) — not large-scale",
  "Fisetin is a flavonoid with weak senolytic activity at supplement-relevant doses",
  "Navitoclax has on-target thrombocytopenia toxicity — limits chronic dosing",
  "Senescence biomarkers (p16, SASP) are surrogates, not clinical endpoints — flag accordingly",
]

forbidden_verbs_for_protocol_role = [
  "found", "showed", "improved", "reduced",
  "demonstrated", "established", "proved",
]

forbidden_verbs_for_results_role_with_protocol_keywords = [
  "planned", "will assess", "pending", "ongoing", "awaiting",
]


# --- v2 generic-multi-topic top-level fields -------------------------

active_arm_synonyms = [
  "senolytic",
  "dasatinib",
  "quercetin",
  "fisetin",
  "navitoclax",
  "D+Q",
  "DQ",
]

placebo_arm_synonyms = [
