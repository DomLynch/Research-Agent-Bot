  "vehicle",
  "saline",
]

corpus_search_queries = [
  "senolytic AND aging AND human",
  "(dasatinib AND quercetin) AND aging",
  "fisetin AND senescence AND aging",
  "navitoclax AND senescent AND clinical",
  "senolytic AND clinical trial AND randomized",
  "(senolytic OR senescence) AND (longevity OR healthspan)",
  "(p16 OR SASP OR senescent cell) AND human AND clinical",
  "senotherapeutic AND older adults AND trial",
  "(senescent cell OR SASP) AND frailty AND human",
  "(dasatinib OR quercetin OR fisetin) AND safety AND tolerability",
]

canonical_rct_paper_ids = []


# --- Calibrated retrieval -------------------------------------------

[retrieval]
topic_terms    = [
  "senolytic", "senolytics", "senotherapeutic", "dasatinib",
  "quercetin", "fisetin", "navitoclax", "ABT-263", "D+Q",
  "senescent cell", "senescence-associated secretory phenotype",
  "p16INK4a",
]
scope_terms    = [
  "aging", "longevity", "healthspan", "older adults", "elderly",
  "frailty", "senescence", "SASP", "p16", "gait speed",
  "physical function", "inflammation", "tissue function", "safety",
]
evidence_types = [
  "clinical trial", "randomized controlled trial", "cohort study",
  "observational study", "meta-analysis", "systematic review",
  "phase 1", "phase 2",
]
exclude_terms  = [
  "oncology only", "transplant only", "in vitro only",
  "cell culture only", "animal only", "pediatric only",
]
