topic = "vitamin_d"
class_ = "nutritional_supplement"

aliases = ["vitamin D", "cholecalciferol", "ergocalciferol", "25-hydroxyvitamin D", "calcifediol"]
expected_evidence_slots = ["human_rcts", "human_observational", "human_mechanism", "meta_analysis", "safety_tolerability", "dosing_regimen", "falls", "fractures", "mortality"]
special_rules = [
  "Separate baseline deficiency correction from supplementation in sufficient populations.",
  "Treat falls, fractures, muscle function, infection, cancer, and mortality as separate outcomes.",
  "Do not infer causality from observational 25-hydroxyvitamin D associations without trial support.",
]
forbidden_verbs_for_protocol_role = ["found", "showed", "improved", "reduced", "demonstrated", "established", "proved"]
forbidden_verbs_for_results_role_with_protocol_keywords = ["planned", "will assess", "pending", "ongoing", "awaiting"]
active_arm_synonyms = ["vitamin D", "cholecalciferol", "ergocalciferol", "calcifediol"]
placebo_arm_synonyms = ["placebo", "control", "usual care", "no supplement"]
corpus_search_queries = [
  "vitamin D AND older adults AND randomized trial",
  "vitamin D AND aging AND mortality",
  "cholecalciferol AND falls AND elderly",
  "vitamin D AND fractures AND meta-analysis",
  "25-hydroxyvitamin D AND frailty AND older adults",
]
canonical_rct_paper_ids = []
canonical_trials = []
known_role_overrides = {}

[retrieval]
topic_terms = ["vitamin D", "cholecalciferol", "ergocalciferol", "25-hydroxyvitamin D", "calcifediol"]
scope_terms = ["aging", "older adults", "elderly", "geriatric", "frailty", "falls", "fractures", "mortality", "muscle function"]
evidence_types = ["clinical trial", "randomized controlled trial", "cohort study", "observational study", "meta-analysis", "systematic review"]
exclude_terms = ["pediatric only", "pregnancy only", "animal only", "in vitro only", "dialysis only"]
date_from = 2000
languages = ["English"]
species = ["humans"]

[retrieval.background]
allow = ["vitamin D endocrine biology", "bone metabolism", "muscle function", "deficiency epidemiology"]

[endpoint_polarity]
