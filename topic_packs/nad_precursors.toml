# NAD precursors topic pack — Proof 006
#
# Nicotinamide adenine dinucleotide (NAD+) precursors are widely
# marketed anti-aging supplements. NMN (nicotinamide mononucleotide)
# and NR (nicotinamide riboside) are the two most-studied. Mostly
# observational + small RCTs; geroprotective effects in humans
# remain inconclusive.

topic   = "nad_precursors"
class_  = "nad_boosting"

aliases = [
  "NAD",
  "NAD+",
  "NAD precursor",
  "NAD booster",
  # Specific compounds
  "nicotinamide riboside",
  "NR",
  "nicotinamide mononucleotide",
  "NMN",
  "nicotinamide",
  "niacinamide",
  "Niagen",   # commercial NR brand
  "Tru Niagen",
  "NMN supplement",
]

expected_evidence_slots = [
  "human_rcts",
  "human_observational",
  "human_mechanism",
  "preclinical_lifespan",
  "safety_tolerability",
  "dosing_regimen",
  "ongoing_trials",
  "nad_biomarkers",     # blood/tissue NAD+ levels — surrogate
  "skeletal_muscle_outcomes",
  "cognitive_outcomes",
]

special_rules = [
  "human evidence for NAD precursors is sparse and mostly biomarker-based (blood NAD+ levels)",
  "no large mortality or healthspan endpoint trial has been completed",
  "NMN vs NR are biochemically distinct — flag explicitly which compound was studied",
  "any 'NAD-boosting' claim must reference whether intracellular NAD+ rose, not just blood",
  "supplement-grade studies should be tier B at best (no FDA oversight)",
]

forbidden_verbs_for_protocol_role = [
  "found", "showed", "improved", "reduced",
  "demonstrated", "established", "proved",
]

forbidden_verbs_for_results_role_with_protocol_keywords = [
  "planned", "will assess", "pending", "ongoing", "awaiting",
]


# --- v2 generic-multi-topic top-level fields -------------------------

active_arm_synonyms = [
  "NAD",
  "NMN",
  "NR",
  "nicotinamide riboside",
  "nicotinamide mononucleotide",
  "nicotinamide",
  "niacinamide",
  "nicotinamide adenine dinucleotide",
]

placebo_arm_synonyms = [
  "placebo",
  "control",
  "PLA",
  "vehicle",
]

corpus_search_queries = [
  "(nicotinamide riboside OR NR) AND aging AND human",
  "(NMN OR nicotinamide mononucleotide) AND aging AND clinical",
  "NAD precursor AND clinical trial AND randomized",
  "NAD AND (longevity OR healthspan) AND human",
  "(NMN OR NR) AND elderly AND (frailty OR sarcopenia OR muscle)",
  "NAD AND (cognitive OR cardiovascular) AND outcomes",
  "(NMN OR NR) AND safety AND tolerability AND human",
  "(nicotinamide riboside OR nicotinamide mononucleotide) AND muscle AND older adults",
  "(NAD precursor OR NAD booster) AND mitochondrial function AND human",
  "(NR OR NMN) AND inflammation AND randomized",
]

canonical_rct_paper_ids = []


# --- Calibrated retrieval -------------------------------------------

[retrieval]
topic_terms    = [
  "NAD precursor", "NAD booster", "nicotinamide riboside",
  "nicotinamide mononucleotide", "NR", "NMN", "nicotinamide",
  "niacinamide", "nicotinamide adenine dinucleotide",
]
scope_terms    = [
  "aging", "older adults", "elderly", "geriatric", "longevity",
  "healthspan", "frailty", "sarcopenia", "muscle function",
  "cognition", "cardiometabolic", "mitochondrial function",
  "inflammation", "insulin sensitivity",
]
evidence_types = [
  "clinical trial", "randomized controlled trial", "cohort study",
  "observational study", "meta-analysis", "systematic review",
]
exclude_terms  = [
  "animal only", "in vitro only", "cell culture only",
  "pediatric only", "dermatology only", "case report only",
]
date_from      = 2010
languages      = ["English"]

[retrieval.background]
allow = [
  "NAD metabolism mechanism",
  "sirtuin mechanism",
  "mitochondrial aging rationale",
  "supplement safety history",
  "DNA repair biology",
  "cellular energetics",
]


