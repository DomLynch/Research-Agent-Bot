# Statins topic pack — Proof 003 (multi-topic scalability proof)
#
# This pack was created from scratch in one file to test the
# generic multi-topic refactor. No code changes required to add
# this topic — the entire pipeline (corpus discovery, synthesis,
# audit, cert, bundle) reads from this TOML.

topic   = "statins"
class_  = "hmg_coa_reductase_inhibitor"

aliases = [
  "statin",
  "statins",
  "HMG-CoA reductase inhibitor",
  "HMGCR inhibitor",
  # Specific drugs
  "atorvastatin",
  "rosuvastatin",
  "simvastatin",
  "pravastatin",
  "lovastatin",
  "pitavastatin",
  "fluvastatin",
]

expected_evidence_slots = [
  "human_rcts",
  "human_observational",
  "human_mechanism",
  "preclinical_lifespan",
  "safety_tolerability",
  "dosing_regimen",
  "exercise_interaction",  # statin-induced myopathy interaction
  "ongoing_trials",
  "primary_prevention",    # statin-specific
  "secondary_prevention",  # statin-specific
]

special_rules = [
  "primary-prevention vs secondary-prevention RCTs must be tagged distinctly — different effect sizes",
  "statin-induced myopathy is a known safety signal; trials must report myalgia/CK",
  "any claim citing JUPITER, HOPE-3, or PROSPER must reference RCT design",
  "observational data must flag indication-bias (high-risk patients selected for treatment)",
]

forbidden_verbs_for_protocol_role = [
  "found", "showed", "improved", "reduced",
  "demonstrated", "established", "proved",
]

forbidden_verbs_for_results_role_with_protocol_keywords = [
  "planned", "will assess", "pending", "ongoing", "awaiting",
]


# --- v2 generic-multi-topic top-level fields -------------------------

active_arm_synonyms = [
  "statin",
  "atorvastatin",
  "rosuvastatin",
  "simvastatin",
  "pravastatin",
  "lovastatin",
  "pitavastatin",
  "STATIN",
]

placebo_arm_synonyms = [
  "placebo",
  "control",
  "PLA",
  "vehicle",
  "no statin",
]

corpus_search_queries = [
  "statin AND aging AND human",
  "statin AND (RCT OR clinical trial OR randomized)",
  "(atorvastatin OR rosuvastatin OR simvastatin) AND (longevity OR healthspan OR mortality)",
  "statin AND elderly AND (frailty OR sarcopenia OR muscle)",
  "statin AND primary prevention AND cardiovascular",
  "statin AND (myopathy OR myalgia OR adverse) AND elderly",
  "statin AND mTOR AND mechanism",
  # Refactor 2026-05-04: broader queries to deepen corpus density
  # (Q9 audit needs ≥8 numerics/1000 words; thin corpus → low density)
  "statin AND (LDL cholesterol OR lipid lowering) AND clinical",
  "statin AND (PROSPER OR HOPE-3 OR JUPITER OR STAREE) AND outcomes",
  "(atorvastatin OR rosuvastatin) AND (cognitive OR dementia OR Alzheimer) AND outcome",
  "statin AND (cancer incidence OR cancer mortality) AND cohort",
  "statin AND inflammation AND (CRP OR hsCRP OR cytokine)",
  "statin AND meta-analysis AND (mortality OR cardiovascular event)",
]

# Empty initially — will be populated as canonical RCTs are
# identified in the corpus. The pipeline still works without
# entries here (it just doesn't apply the A1-direct override).
canonical_rct_paper_ids = []


