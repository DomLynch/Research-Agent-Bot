corpus_search_queries = [
  "intermittent fasting AND aging AND randomized trial",
  "time-restricted eating AND older adults",
  "alternate-day fasting AND metabolic health",
  "intermittent fasting AND longevity AND human",
  "time restricted feeding AND cardiometabolic AND trial",
]
canonical_rct_paper_ids = []
canonical_trials = []
known_role_overrides = {}

[retrieval]
