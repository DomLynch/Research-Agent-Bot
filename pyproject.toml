[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-bot"
version = "0.1.0"
description = "Minimal research draft tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "psycopg2-binary>=2.9,<3",
  "PyMuPDF>=1.24,<2",
  "pypdf>=4,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  # Required for async-test support: tests/test_source_hardening.py and
  # tests/test_enrichment_v2.py use @pytest.mark.asyncio. Without this
  # plugin a clean `pytest -q` fails 72 tests with "async def functions
  # are not natively supported." Pinned to 1.x for the asyncio_mode auto
  # default.
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<0.16",
  "mypy>=1.18,<2",
]
diagnostics = [
  "coverage[toml]>=7.16,<8",
  "hypothesis>=6.167,<7",
  "py-spy>=0.4,<1",
  "pytest>=8,<9",
  "pytest-randomly>=5,<6",
  "viztracer>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
# Auto-mode: pytest-asyncio treats `async def test_*` as async tests
# without requiring per-test @pytest.mark.asyncio. Existing tests use
# the marker explicitly; this keeps "strict" semantics consistent with
# how the suite was written.
asyncio_mode = "strict"

[tool.mypy]
mypy_path = "scripts"
explicit_package_bases = true
exclude = '^scripts/(review_noise_control|render_quality_tables)\.py$'

[[tool.mypy.overrides]]
module = ["fitz", "pdfplumber", "pypdf"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
# Only ship the current runtime package.
include = ["agent", "agent.*"]
