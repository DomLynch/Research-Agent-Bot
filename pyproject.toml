[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-bot"
version = "0.1.0"
description = "Minimal research draft tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  # Required for async-test support: tests/test_source_hardening.py and
  # tests/test_enrichment_v2.py use @pytest.mark.asyncio. Without this
  # plugin a clean `pytest -q` fails 72 tests with "async def functions
  # are not natively supported." Pinned to 1.x for the asyncio_mode auto
  # default.
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Auto-mode: pytest-asyncio treats `async def test_*` as async tests
# without requiring per-test @pytest.mark.asyncio. Existing tests use
# the marker explicitly; this keeps "strict" semantics consistent with
# how the suite was written.
asyncio_mode = "strict"

[tool.setuptools.packages.find]
# Only ship the V1 runtime. agent_legacy/ stays on disk for git archaeology
# and is reachable via pythonpath = ["."], but must never be installed.
include = ["agent", "agent.*"]

[tool.mypy]
# tests_legacy/ + agent_legacy/ are pre-V1 archaeology on disk for git
# history; they shadow live-suite module names and would raise
# Duplicate-module on a flat walk.
# scripts/ is imported via sys.path hacks (`import grok_reviewer`)
# AND walked as the `scripts` package, so a flat walk finds every
# scripts/*.py twice. Explicit-package-bases + mypy_path sequencing
# (".", which prefers the in-tree top-level `scripts` package over
# the auto-discovered `<file>` form) is the standard fix per
# https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules
exclude = ["^tests_legacy/", "^agent_legacy/"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
