[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-bot"
version = "0.1.0"
description = "Minimal research draft tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
# Only ship the V1 runtime. agent_legacy/ stays on disk for git archaeology
# and is reachable via pythonpath = ["."], but must never be installed.
include = ["agent", "agent.*"]
