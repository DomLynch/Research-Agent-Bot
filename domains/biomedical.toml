# Biomedical domain adapter — Slice 8 step B (2026-05-05)
#
# Loaded by agent/domain_evidence.py via stdlib tomllib. Topic packs
# reference this file via `domain = "biomedical"` at the top level.
# Universal: every biomedical topic (any drug / disease / intervention)
# uses this exact adapter. No topic-specific values here — those live
# in topic_packs/<topic>.toml.

[domain]
name = "biomedical"

# Evidence hierarchy — ordered strongest → weakest. Used by SPAR
# adjudication, the corpus classifier, the Q5 internal-tier guard,
# and the cert-floor maturity ladder.
evidence_hierarchy = [
  "rct",                    # randomized controlled trial
  "meta_analysis",          # quantitative pooled analysis
  "cohort",                 # prospective observational
  "case_control",
  "cross_sectional",
  "registry",               # registered trial without results yet
  "mechanistic",            # human mechanistic / preclinical landmark
  "review",                 # narrative
  "preclinical",            # animal / in vitro
]

# Outcome classes — the categories receipts can be tagged with.
# A run with all receipts in one outcome class fails the
# outcome-diversity gate (≥3 classes for AAA).
outcome_classes = [
  "mortality",
  "function",               # gait speed, grip strength, frailty
  "biomarker",              # HbA1c, BP, lipids, BMI
  "safety",                 # adverse events
  "longevity",              # lifespan / healthspan
  "cardiometabolic",
  "cognitive",
  "muscle_function",
  "frailty",
  "immune",
]

# Receipt context that must be extracted to qualify as a receipt.
# Missing fields → SPAR rejection.
required_context_fields = [
  "population",             # who studied
  "intervention",           # what given
  "comparator",             # baseline / placebo
  "outcome",                # what measured
]

# Signals that mark a paper as core clinical evidence (used by
# corpus_classifier on title + abstract).
core_clinical_signals = [
  "randomized controlled trial",
  "randomised controlled trial",
  " rct ",
  "(rct)",
  "cohort study",
  "case-control study",
  "meta-analysis",
  "systematic review",
  "all-cause mortality",
  "primary prevention",
  "secondary prevention",
  "incident cancer",
  "incidence of",
  "real-world evidence",
  "trial emulation",
  "biobank",
  "registry-based",
]

# Signals that mark a paper as mechanism / preclinical (background
# pool, not core).
mechanism_signals = [
  "in vitro",
  "cell culture",
  "molecular mechanism",
  "signaling pathway",
  "kinase activity",
  "expression of",
  "transcriptional",
  "protein interaction",
  "receptor binding",
  "knockout mouse",
  "transgenic mouse",
  "pharmacokinetics",
  "pharmacodynamics",
  "wistar rat",
  "wistar rats",
  "drosophila",
  "c. elegans",
  "yeast",
]

# Hard reject — irrelevant species/topics. Topic-pack alias hits
# rescue these (so a "stroke + statin RCT" doesn't drop because
# "stroke patients" is in the reject list).
reject_signals = [
  "traumatic brain injury",
  " tbi ",
  "tbi-",
  "burn wound",
  "cerebral cavernous malformation",
  "atrial fibrillation",
  "cardioversion",
  "stroke patients",
  "neurovascular unit",
  "blood-brain barrier",
]
