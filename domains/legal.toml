# Legal / regulatory domain adapter — Slice 8 step B (2026-05-05).
#
# Demonstrates "any industry" coverage: same engine, just a
# different evidence hierarchy + outcome shape. Used by topic
# packs targeting legal precedent, regulatory effects, etc.

[domain]
name = "legal"

# Evidence hierarchy: precedent strength + jurisdiction depth.
evidence_hierarchy = [
  "supreme_court_decision",
  "appellate_decision",
  "trial_court_decision",
  "regulatory_ruling",
  "administrative_guidance",
  "scholarly_commentary",
  "law_review_article",
  "policy_brief",
]

outcome_classes = [
  "constitutional",
  "statutory_interpretation",
  "regulatory_compliance",
  "tort",
  "contract",
  "criminal",
  "administrative",
]

required_context_fields = [
  "jurisdiction",
  "parties",
  "issue",
  "holding",
]

core_clinical_signals = [
  "supreme court",
  "court of appeals",
  "appellate decision",
  "binding precedent",
  "stare decisis",
  "circuit split",
  "en banc",
]

mechanism_signals = [
  "doctrinal analysis",
  "statutory construction",
  "legal theory",
  "law and economics",
]

reject_signals = [
  "marketing legal blog",
  "client testimonial",
]
