name: Publication Quality CI Gate

on:
  push:
    branches: [main, "codex/019e9ce8/main"]
  pull_request:
    branches: [main, "codex/019e9ce8/main"]

permissions:
  contents: read

jobs:
  publication-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run frozen publication-quality contracts
        run: |
          python -m pytest -q \
            tests/test_publication_scorer.py \
            tests/test_journal_surface_gate.py \
            tests/test_polish_pre_public.py \
            tests/test_surface_render_lint.py \
            tests/test_daily_research_paper_submit.py \
            tests/test_final_status.py
