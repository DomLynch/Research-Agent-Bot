name: Eval Corpus CI Gate

on:
  push:
    branches: [main, eval-corpus]
  pull_request:
    branches: [main, eval-corpus]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache PubMed/OpenAlex responses
        uses: actions/cache@v4
        with:
          path: ~/.cache/requests
          key: pubmed-cache-${{ hashFiles('tests/golden/topics/*.json') }}
          restore-keys: |
            pubmed-cache-

      - name: Run golden eval tests
        id: eval
        run: |
          cd tests/golden
          python -c "
import json, os, sys
from harness import composite_score

topics_dir = '../golden/topics'
results = []
for fname in sorted(os.listdir(topics_dir)):
    if not fname.endswith('.json'):
        continue
    with open(os.path.join(topics_dir, fname)) as f:
        gold = json.load(f)
    slug = fname[:-5]
    results.append({'topic': slug, 'gold': gold})

# Load sample draft if exists, else minimal mock
for r in results:
    draft_path = f'fixtures/{r[\"topic\"]}_draft.json'
    if os.path.exists(draft_path):
        with open(draft_path) as f:
            draft = json.load(f)
    else:
        draft = {
            'source_bundle': [],
            'sections': {
                'Key Findings': 'Insufficient evidence.',
                'Conclusion': 'More research needed.',
                'Limitations': 'Limited data available.'
            }
        }
    r['score'] = composite_score(draft, r['gold'])

# Print summary table
print('## Gold Topic Scores')
print('| Topic | Composite | Study Overlap | Direction | Limitation | Quant Fidelity |')
print('|-------|-----------|---------------|-----------|------------|----------------|')
for r in results:
    print(f'| {r[\"topic\"]} | {r[\"score\"]:.3f} | | | | |')
print()
print(f'AVG_SCORE={sum(x[\"score\"] for x in results) / len(results):.3f}')
" > eval_summary.txt || true
          cat eval_summary.txt || echo "Eval summary not generated"

      - name: Run pytest
        run: |
          .venv/bin/python -m pytest tests/test_golden.py -v --tb=short 2>&1 | head -100

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('tests/golden/eval_summary.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Eval Corpus Scores\n\n${summary}\n\n_Full test results in CI run_`
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
