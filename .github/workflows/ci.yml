name: CI Gate

on:
  push:
    branches: [main, "codex/019e9ce8/main"]
  pull_request:
    branches: [main, "codex/019e9ce8/main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check
        run: mypy agent scripts

      - name: LOC budgets
        run: python -m pytest -q tests/test_loc_budget.py

      - name: Unit tests
        run: python -m pytest tests/ -v --tb=short -m "not gold_smoke and not full_matrix"
