name: CI Gate

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import boundaries
        run: lint-imports --no-cache

      - name: Lint (ruff)
        run: ruff check .

      - name: Quality ratchets and randomized lifecycle
        run: make quality PYTHON=python

      - name: Type check
        run: mypy agent scripts

      - name: LOC budgets
        run: python -m pytest -q tests/test_loc_budget.py

      - name: Unit tests
        run: python -m coverage run --branch --source=agent,scripts -m pytest tests/ -v --tb=short -m "not gold_smoke and not full_matrix"

      - name: Diff coverage trial (report only)
        if: success()
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "Diff coverage unavailable: event has no comparison base." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m coverage xml -o coverage.xml
          diff-cover coverage.xml --compare-branch="$base" --fail-under=0 --format markdown:diff-coverage.md
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff coverage trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage
          path: |
            coverage.xml
            diff-coverage.md
          if-no-files-found: ignore
