name: Weekly Reports

on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unpaywall smoke
        env:
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
        run: PYTHONPATH=. python scripts/unpaywall_smoke.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          path: docs/weekly/
          if-no-files-found: error
