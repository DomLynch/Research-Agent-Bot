name: Weekly Reports

on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unpaywall smoke
        run: PYTHONPATH=. python scripts/unpaywall_smoke.py || echo "::warning::Unpaywall smoke failed — check adapter or Unpaywall API status"

      - name: Weekly report
        run: PYTHONPATH=. python scripts/weekly_report.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          path: |
            runs/

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: weekly report auto-update"
          file_pattern: docs/weekly/*
