name: Karpathy PR

on:
  pull_request:
    branches: [main, "codex/019e9ce8/main"]

jobs:
  karpathy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Snapshot PR scores
        run: PYTHONPATH=. python scripts/karpathy_loop.py snapshot --output-dir pr_snapshots

      - name: Upload PR snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr-snapshot
          path: pr_snapshots/
          retention-days: 1

      - name: Snapshot main scores
        run: |
          git stash --include-untracked
          git fetch origin "${{ github.base_ref }}"
          git checkout "origin/${{ github.base_ref }}"
          PYTHONPATH=. python scripts/karpathy_loop.py snapshot --output-dir baseline_snapshots

      - name: Download PR snapshot
        uses: actions/download-artifact@v4
        with:
          name: pr-snapshot
          path: pr_snapshots/

      - name: Diff snapshots
        id: diff
        run: |
          PR_SNAP=$(ls -t pr_snapshots/*_snapshot.json | head -1)
          BASE_SNAP=$(ls -t baseline_snapshots/*_snapshot.json | head -1)
          echo "PR snapshot: $PR_SNAP"
          echo "Baseline snapshot: $BASE_SNAP"
          PYTHONPATH=. python scripts/karpathy_loop.py diff "$BASE_SNAP" "$PR_SNAP" > diff_output.txt || true
          cat diff_output.txt

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Karpathy Score Diff\n\n';
            try {
              const diff = fs.readFileSync('diff_output.txt', 'utf8');
              body += '```\n' + diff + '\n```\n';
            } catch (e) {
              body += '_Diff not available._\n';
            }
            body += '_Full results in CI run artifacts._';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
