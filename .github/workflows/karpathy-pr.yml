name: PR Quality Baseline

on:
  pull_request:
    branches: [main, "codex/019e9ce8/main"]

jobs:
  quality-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check PR quality
        run: make quality PYTHON=python

      - name: Check base quality
        run: |
          git fetch origin "${{ github.base_ref }}"
          git checkout "origin/${{ github.base_ref }}"
          make quality PYTHON=python
